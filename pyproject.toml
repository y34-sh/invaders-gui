[project]
name = "invaders-gui"
version = "1.0.0"
description = "Graficzna (Qt/PySide6) wersja gry Invaders – używa niezmienionego silnika invaders.core"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "invaders",
    "PySide6-Essentials>=6.7",
]

[project.scripts]
invaders-gui = "invaders_gui.__main__:main"

[tool.uv.sources]
invaders = { path = "../invaders", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invaders_gui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "RUF012", "N802"]
